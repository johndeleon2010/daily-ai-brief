name: Daily AI Brief

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * 1-5"
    - cron: "0 15 * * 1-5"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "delivery/**"
      - "creators.json"
      - ".github/workflows/daily-brief.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "delivery/**"
      - "creators.json"
      - ".github/workflows/daily-brief.yml"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - name: Test browser delivery date guard
        shell: bash
        run: |
          pwsh -NoProfile -File delivery/Open-DailyAIBrief.ps1 -DataPath tests/fixtures/latest-current.json -ExpectedDate 2026-09-17 -NoOpen -MaxMinutes 0 -PollSeconds 0
          set +e
          pwsh -NoProfile -File delivery/Open-DailyAIBrief.ps1 -DataPath tests/fixtures/latest-stale.json -ExpectedDate 2026-09-17 -NoOpen -MaxMinutes 0 -PollSeconds 0
          code=$?
          set -e
          test "$code" -eq 1

  browser-delivery-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test Microsoft Edge detection
        shell: powershell
        run: |
          powershell.exe -NoProfile -File .\delivery\Open-DailyAIBrief.ps1 -CheckBrowser
          if ($LASTEXITCODE -ne 0) { throw "Microsoft Edge detection failed." }
      - name: Test browser delivery date guard
        shell: powershell
        run: |
          powershell.exe -NoProfile -File .\delivery\Open-DailyAIBrief.ps1 -DataPath tests\fixtures\latest-current.json -ExpectedDate 2026-09-17 -NoOpen -MaxMinutes 0 -PollSeconds 0
          if ($LASTEXITCODE -ne 0) { throw "Current brief fixture failed." }
          powershell.exe -NoProfile -File .\delivery\Open-DailyAIBrief.ps1 -DataPath tests\fixtures\latest-stale.json -ExpectedDate 2026-09-17 -NoOpen -MaxMinutes 0 -PollSeconds 0
          if ($LASTEXITCODE -ne 1) { throw "Stale brief fixture did not fail as expected." }
      - name: Test live browser delivery download
        shell: powershell
        run: |
          $stamp = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          $brief = Invoke-RestMethod -Uri ("https://johndeleon2010.github.io/daily-ai-brief/data/latest.json?stamp=" + $stamp) -Headers @{ "Cache-Control" = "no-cache" }
          powershell.exe -NoProfile -File .\delivery\Open-DailyAIBrief.ps1 -ExpectedDate ([string]$brief.date) -NoOpen -MaxMinutes 0 -PollSeconds 0
          if ($LASTEXITCODE -ne 0) { throw "Live browser delivery download failed." }

  publish:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: [test, browser-delivery-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Pacific schedule
        id: gate
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "$(TZ=America/Los_Angeles date +%H)" == "07" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate brief
        if: steps.gate.outputs.run == 'true'
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NOTION_CONTENT_DATA_SOURCE: ${{ vars.NOTION_CONTENT_DATA_SOURCE }}
          NOTION_BRIEF_DATA_SOURCE: ${{ vars.NOTION_BRIEF_DATA_SOURCE }}
        run: python src/generate_brief.py --force
      - name: Save brief history
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          git config user.name "daily-ai-brief-bot"
          git config user.email "daily-ai-brief-bot@users.noreply.github.com"
          git add docs/data docs/feed.xml
          git diff --cached --quiet || git commit -m "Publish daily AI brief"
          git push
